```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Register</title>

    <!-- CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='register.css') }}">

    <style>

        /* CAMERA */

        #video{
            width: 100%;
            height: 220px;
            object-fit: cover;
            border-radius: 15px;
            margin-bottom: 15px;
            background: black;
            border: 2px solid rgba(255,255,255,0.2);
        }

    </style>

</head>

<body>

<div class="login-box">

    <div class="form-box">

        <form method="POST" action="/register">

            <h2>Register</h2>

            <!-- ERROR MESSAGE -->

            {% if error %}
                <p style="color:red; text-align:center;">
                    {{ error }}
                </p>
            {% endif %}

            <!-- USERNAME -->

            <div class="input-box">

                <span class="icon">
                    <ion-icon name="person-outline"></ion-icon>
                </span>

                <input type="text" name="username" required>

                <label>Username</label>

            </div>

            <!-- PASSWORD -->

            <div class="input-box">

                <span class="icon">
                    <ion-icon name="lock-closed-outline"></ion-icon>
                </span>

                <input type="password" name="password" required>

                <label>Password</label>

            </div>

            <!-- CAMERA -->

            <video id="video" autoplay playsinline></video>

            <canvas id="canvas" style="display:none;"></canvas>

            <!-- FACE IMAGE -->

            <input type="hidden" name="face_image" id="face_image">

            <!-- FACE BUTTON -->

            <button type="button" onclick="captureFace()">
                Face Verification
            </button>

            <br><br>

            <!-- REGISTER BUTTON -->

            <button type="submit">
                Register
            </button>

            <!-- LOGIN LINK -->

            <div class="register-link">

                <p>
                    Already have account?
                    <a href="/login">Login</a>
                </p>

            </div>

        </form>

    </div>

</div>

<!-- CAMERA SCRIPT -->

<script>

const video = document.getElementById("video");

let faceCaptured = false;

navigator.mediaDevices.getUserMedia({ video: true })
.then(stream => {
    video.srcObject = stream;
    video.onloadedmetadata = () => video.play();
})
.catch(error => {
    alert("Camera access denied");
    console.log(error);
});

// ✅ VALIDATION BEFORE REGISTER
function validateFace() {

    const face = document.getElementById("face_image").value;

    if (!face || face.length < 1000 || !faceCaptured) {
        alert("Please capture your face before registering!");
        return false;
    }

    return true;
}

// ✅ FIXED FACE CAPTURE
function captureFace() {

    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");

    if (video.videoWidth === 0 || video.videoHeight === 0) {
        alert("Camera not ready yet!");
        return;
    }

    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;

    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

    const imageData = canvas.toDataURL("image/jpeg", 0.9);

    document.getElementById("face_image").value = imageData;

    faceCaptured = true;

    alert("Face captured successfully");
}

</script>

<!-- Ionicons -->

<script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>

<script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>

</body>
</html>
